<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4F46E5">
<title>Страница не найдена — Веди</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/owl-logo-small.png">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; min-height: 100vh; background: #FAF7F5; }
  body { display: flex; align-items: center; justify-content: center; padding: 32px; position: relative; overflow: hidden; }
  .bg-blob { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.4; pointer-events: none; }
  .blob-1 { width: 500px; height: 500px; background: #C7D2FE; top: -150px; left: -150px; }
  .blob-2 { width: 400px; height: 400px; background: #FBCFE8; bottom: -100px; right: -100px; }
  .card {
    background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
    border: 1px solid rgba(79,70,229,0.1); border-radius: 28px;
    padding: 56px; max-width: 480px; width: 100%; text-align: center;
    box-shadow: 0 32px 64px -16px rgba(79,70,229,0.2); position: relative; z-index: 1;
  }
  .card img { width: 64px; height: 64px; margin-bottom: 24px; }
  .code {
    font-family: var(--font-display); font-weight: 800; font-size: 96px;
    background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 50%, #3B82F6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -0.04em; line-height: 1; margin-bottom: 16px;
  }
  h1 { font-family: var(--font-display); font-size: 28px; color: var(--indigo-950); margin: 0 0 12px; letter-spacing: -0.02em; }
  p { color: var(--fg-2); font-size: 16px; line-height: 1.55; margin: 0 0 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 14px;
    background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 50%, #3B82F6 100%);
    color: #fff; text-decoration: none; font-family: var(--font-body); font-weight: 600; font-size: 15px;
    box-shadow: 0 16px 32px -8px rgba(124,58,237,0.4); transition: all 0.25s; border: none;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 20px 40px -8px rgba(124,58,237,0.5); }
</style>
</head>
<body>
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="card">
  <img src="assets/owl-logo.png" alt="Веди">
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p>Возможно, вы перешли по устаревшей ссылке. Давайте вернёмся на главную — там самое важное про Веди.</p>
  <a href="/" class="btn">← На главную</a>
</div>
</body>
</html>
